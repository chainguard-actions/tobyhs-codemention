name: Test codemention graceful failure outside PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action; it will fail because workflow_dispatch has no pull_request payload.
      # We use continue-on-error so we can assert on the outcome.
      - id: action
        uses: .
        with:
          githubToken: ${{ github.token }}
        continue-on-error: true

      # The action MUST fail when not triggered by a pull_request event,
      # because context.payload.pull_request is undefined and accessing
      # pullRequest.draft throws a TypeError (unhandled promise rejection).
      - name: Assert action failed as expected outside PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail outside PR context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context"
