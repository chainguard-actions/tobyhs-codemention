name: Test basic usage (non-PR context graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action uses github.context (JS action). Under act the event is always
      # workflow_dispatch, so context.payload.pull_request is undefined. The action
      # will call core.setFailed() and exit non-zero. We accept that as a graceful
      # failure — the important thing is that the build steps (npm install, npm run
      # build, node run.js) all execute without crashing the runner itself.
      - id: action
        uses: .
        continue-on-error: true
        with:
          githubToken: ${{ github.token }}

      - name: Assert action ran and failed gracefully (not a PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (perhaps PR context was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (workflow_dispatch is not a pull_request event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
