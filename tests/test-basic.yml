name: Test basic build and run
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is designed for pull_request_target events.
      # Under workflow_dispatch, github.context.payload has no pull_request,
      # so the action will call core.setFailed() with a TypeError after building.
      # We use continue-on-error to capture this expected failure and verify
      # that the action at least built and ran (not a build/install failure).
      - id: action
        uses: .
        continue-on-error: true
        with:
          githubToken: ${{ github.token }}

      - name: Assert action ran (build succeeded and node executed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail with a runtime TypeError (no pull_request in context)
          # after successfully building. 'failure' is the expected outcome.
          # 'success' would be unexpected but we allow it to avoid flakiness.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — expected success or failure"
            exit 1
          fi
