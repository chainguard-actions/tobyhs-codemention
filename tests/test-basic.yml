name: Test codemention basic (non-PR context graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action; it will fail because workflow_dispatch has no
      # pull_request payload, but we want to verify the build steps succeed
      # and the failure is a runtime error (not a build/install error).
      - id: action
        uses: .
        with:
          githubToken: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (build succeeded) and failed at runtime due to non-PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because there is no pull_request payload
          # under workflow_dispatch. A 'failure' outcome means the build steps
          # completed and node run.js executed (it just errored on missing PR data).
          # A 'success' would be unexpected; 'skipped' or empty would indicate
          # the action never ran.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at runtime as expected (no PR context under workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may not have run at all"
            exit 1
          fi
