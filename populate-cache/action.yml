# This GitHub action populates the dependency cache. This is a standalone
# action so it can be used to populate the cache for the main/default branch.
# Due to cache restrictions
# (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#restrictions-for-accessing-a-cache),
# a pull request typically cannot save a cache that any other pull request can
# access.

name: 'codemention: populate cache'
description: Populates the dependency cache for codemention
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # Copying the action into the workspace makes things more convenient
    # because some things don't work outside the workspace (actions/setup-node
    # resolves the node-version-file input relative to the workspace; hashFiles
    # only works on files inside the workspace).
    - name: Copy action into workspace
      # If this action is called by the main action (to install dependencies),
      # then action.yml should exist because the action already copied itself
      # to the workspace.
      run: |
        [ -f action.yml ] || cp -r "${GITHUB_ACTION_PATH}/../." .
      shell: bash
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: cache-node-modules
      with:
        path: node_modules
        key: codemention-npm-${{ hashFiles('.node-version', 'package-lock.json') }}
    - run: npm ci
      shell: bash
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
